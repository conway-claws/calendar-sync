name: sync
on:
  schedule:
    - cron: "0 12 * * *"  # daily, 6/7 AM Central
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python3 test/test_calendar_sync.py
      - name: build
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 bin/build.py | tee build.log
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && exit 0
          git commit -m "sync: $(head -1 build.log)"
          git push
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "sync failed $(date -u +%F)" \
            --body "$(tail -40 build.log 2>/dev/null || echo 'no build log')

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label sync-failure || true
