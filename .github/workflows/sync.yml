name: sync
on:
  schedule:
    # Both UTC hours that can be 7:00 AM America/Chicago; the gate step below
    # runs the build only on the one that is, so the job fires at a fixed 7:00
    # local year-round.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: gate on 7 AM Central
        id: gate
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'true'
        run: pip install anthropic
      - if: steps.gate.outputs.run == 'true'
        run: python3 test/test_calendar_sync.py
      - name: build
        id: build
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 bin/build.py | tee build.log
      - name: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && exit 0
          git commit -m "sync: $(head -1 build.log)"
          git push
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "sync failed $(date -u +%F)" \
            --body "$(tail -40 build.log 2>/dev/null || echo 'no build log')

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label sync-failure || true
